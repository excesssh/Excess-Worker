name: Source verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standalone:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            npm: npm
          - os: windows-2022
            npm: npm.cmd
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.11.1
          package-manager-cache: false
      - name: Select pinned npm
        run: ${{ matrix.npm }} install --global npm@11.7.0 --ignore-scripts
      - name: Check pinned toolchain
        run: |
          node -e "if (process.version !== 'v24.11.1') process.exit(1)"
          test "$(${{ matrix.npm }} --version)" = "11.7.0"
      - name: Check history privacy and contributor identity
        run: node scripts/public-worker/privacy.mjs --history
      - name: Install pinned dependencies
        run: ${{ matrix.npm }} ci --ignore-scripts
      - name: Configure disposable runner for namespace fixtures
        if: matrix.os == 'ubuntu-24.04'
        run: |
          # Ubuntu's AppArmor policy denies unprivileged user namespaces by
          # default. Only this disposable CI VM is adjusted, then restored.
          if test -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            prior=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)
            printf 'EXCESS_CI_USERNS_POLICY=%s\n' "$prior" >> "$GITHUB_ENV"
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Probe rootless Linux namespace support
        if: matrix.os == 'ubuntu-24.04'
        run: unshare --user --map-root-user --mount --pid --net --fork true
      - name: Build TypeScript for Linux package fixture
        if: matrix.os == 'ubuntu-24.04'
        run: npm run build
      - name: Build the three pinned Linux helpers
        if: matrix.os == 'ubuntu-24.04'
        run: |
          mkdir -p .cache/ci-linux-native
          node scripts/public-worker/build-linux-sandbox.mjs .cache/ci-linux-native
          node scripts/public-worker/build-linux-controller.mjs .cache/ci-linux-native
          node scripts/public-worker/build-linux-egress-peer.mjs .cache/ci-linux-native
      - name: Build a closed Linux package fixture
        if: matrix.os == 'ubuntu-24.04'
        env:
          EXCESS_RELEASE_SEQUENCE: '3'
        run: |
          node scripts/package-worker.mjs --platform linux-x64 --native-dir .cache/ci-linux-native --require-native --out .cache/ci-linux-package
          printf 'EXCESS_LINUX_CONTROLLER_PACKAGE_DIR=%s/.cache/ci-linux-package/excess-worker-0.1.0-linux-x64\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          printf 'EXCESS_LINUX_CONTROLLER_PACKAGE_ARCHIVE=%s/.cache/ci-linux-package/excess-worker-0.1.0-linux-x64.tar.gz\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Run Linux kernel and package boundary fixtures
        if: matrix.os == 'ubuntu-24.04'
        run: node --test --test-concurrency=1 tests/linux-controller.test.mjs tests/linux-controller-hostile.test.mjs tests/worker-package-linux-controller.test.mjs
      - name: Build and test standalone worker
        run: ${{ matrix.npm }} test
      - name: Inspect source bytes after build
        run: node scripts/public-worker/privacy.mjs
      - name: Restore disposable runner namespace policy
        if: always() && matrix.os == 'ubuntu-24.04' && env.EXCESS_CI_USERNS_POLICY != ''
        run: sudo sysctl -w "kernel.apparmor_restrict_unprivileged_userns=$EXCESS_CI_USERNS_POLICY"
